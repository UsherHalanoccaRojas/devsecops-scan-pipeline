name: 🔐 Security Scan & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # JOB 1: SEMGREP — Análisis estático de código (SAST)
  # ============================================================
  semgrep:
    name: 🔍 Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        run: |
          semgrep \
            --config "p/nodejs" \
            --config "p/javascript" \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --json \
            --output semgrep-results.json \
            app/ || true

      - name: Display Semgrep results summary
        run: |
          echo "=== SEMGREP RESULTS ==="
          semgrep \
            --config "p/nodejs" \
            --config "p/javascript" \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            app/ || true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: Semgrep with error on critical findings
        run: |
          semgrep \
            --config "p/nodejs" \
            --config "p/javascript" \
            --config "p/owasp-top-ten" \
            --severity ERROR \
            --error \
            app/

  # ============================================================
  # JOB 2: GITLEAKS — Detección de secretos en el historial
  # ============================================================
  gitleaks:
    name: 🔑 Gitleaks Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Importante: escanea TODO el historial

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # Solo requerido para orgs

      - name: Upload Gitleaks results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-results
          path: results.sarif

  # ============================================================
  # JOB 3: TRIVY — Análisis de dependencias (SCA) y Dockerfile
  # ============================================================
  trivy:
    name: 🛡️ Trivy SCA & IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Trivy usa --scanners vuln para analizar solo CVEs de dependencias.
      # La detección de SECRETOS la hace Gitleaks (evita duplicados y falsos positivos).

      - name: Run Trivy on filesystem — reporte completo (CRITICAL/HIGH/MEDIUM)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          scanners: 'vuln'           # Solo vulnerabilidades, no secretos
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'table'
          exit-code: '0'            # Solo reporta, no corta el build aquí

      - name: Run Trivy on filesystem — output JSON
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-fs-results.json'
          exit-code: '0'

      - name: Run Trivy config — Dockerfile e IaC
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-fs-results.json

      - name: Trivy strict check — falla solo en CVEs CRITICAL en dependencias
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          scanners: 'vuln'           # Solo CVEs, nunca secretos
          severity: 'CRITICAL'
          exit-code: '1'
          format: 'table'

  # ============================================================
  # JOB 4: DEPLOY — Solo si los 3 escáneres pasan
  # ============================================================
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [semgrep, gitleaks, trivy]   # Depende de los 3 jobs de seguridad
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify deployment start
        run: echo "✅ Todos los escaneos de seguridad pasaron. Iniciando despliegue..."

      - name: Deploy to Render via webhook
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Verify deployment
        run: |
          echo "⏳ Esperando que el servicio esté disponible..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}/health")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Despliegue exitoso! App disponible en ${{ secrets.APP_URL }}"
          else
            echo "⚠️  App devolvió status: $STATUS"
          fi

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Semgrep SAST | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks Secrets | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy SCA | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ✅ Done |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "App URL: ${{ secrets.APP_URL }}" >> $GITHUB_STEP_SUMMARY
